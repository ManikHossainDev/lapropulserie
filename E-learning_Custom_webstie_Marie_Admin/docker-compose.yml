# Admin panel on EC2. Prefer pre-built image from CI (ADMIN_IMAGE).
# Nginx should proxy admin.lapropulserie.fr → host port ADMIN_PORT (default 8003).

services:
  admin:
    image: ${ADMIN_IMAGE:-e-learning-admin:local}
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8005/api/v1}
        VITE_IMAGE_BASE_URL: ${VITE_IMAGE_BASE_URL:-}
    container_name: e-learning-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8003}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
