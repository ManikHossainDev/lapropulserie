# Student website on EC2. Prefer pre-built image from CI (WEB_IMAGE).
# Nginx should proxy the public site domain → host port WEB_PORT (default 8002).

services:
  web:
    image: ${WEB_IMAGE:-e-learning-web:local}
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8005}
    container_name: e-learning-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8002}:8002"
    environment:
      NODE_ENV: production
      PORT: 8002
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8002').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
