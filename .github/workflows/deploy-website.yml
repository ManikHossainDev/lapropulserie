name: Deploy — Website (EC2)

# Monorepo: only when student Next.js app (or this workflow) changes on main.
on:
  push:
    branches: [main]
    paths:
      - 'E-learning_Custom_webstie_Marie/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: e-learning-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.sha }}"
          IMAGE="ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: E-learning_Custom_webstie_Marie
          file: E-learning_Custom_webstie_Marie/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            cd "${{ secrets.EC2_WEB_APP_DIR }}"

            export WEB_IMAGE="${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}"
            if [ -f .env.deploy ] && grep -q '^WEB_IMAGE=' .env.deploy; then
              sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=${WEB_IMAGE}|" .env.deploy
            else
              echo "WEB_IMAGE=${WEB_IMAGE}" >> .env.deploy
            fi

            set -a
            # shellcheck disable=SC1091
            . ./.env.deploy
            set +a

            docker compose pull web
            docker compose up -d web

            sleep 8
            curl -fsS "http://127.0.0.1:${WEB_PORT:-8002}/" >/dev/null
            echo "Deployed ${WEB_IMAGE}"
