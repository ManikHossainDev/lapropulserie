# Production Docker Compose file
# Run with: docker-compose up

services:
  api:
    build: .
    container_name: e-learning-api
    ports:
      - "8005:8005"
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - mongo
      - redis
      - kafka
      - mailhog
    volumes:
      - /tmp/videos:/tmp/videos
    command: node dist/serverV2.js
    networks:
      - e-learning-network
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      # Overrides the .env value (which points at "localhost" — meaningless inside a container)
      MONGO_URL_REMOTE: mongodb://mongo:27017/e-learning
      # .env sets this to the host machine's LAN IP, which a container cannot bind to.
      # 0.0.0.0 makes the app listen on all interfaces inside the container so the port mapping above works.
      BACKEND_IP: 0.0.0.0

  mongo:
    image: mongo:7
    container_name: e-learning-mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - e-learning-network

  redis:
    image: redis:7-alpine
    container_name: e-learning-redis
    restart: always
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    networks:
      - e-learning-network

  kafka:
    # bitnami/kafka free images removed from Docker Hub — use official Apache image
    image: apache/kafka:3.7.0
    container_name: e-learning-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 10485760
    networks:
      - e-learning-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: e-learning-mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - e-learning-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local

networks:
  e-learning-network:
    driver: bridge