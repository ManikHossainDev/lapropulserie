# Backend stack for EC2 / local prod-like runs.
# Prefer pulling a pre-built image (CI/CD). Set API_IMAGE on the host.
# MongoDB: Atlas via MONGODB_URI / MONGODB_URL in .env
# Optional local Mongo: docker compose --profile local-db up -d

services:
  api:
    image: ${API_IMAGE:-e-learning-api:local}
    build: .
    container_name: e-learning-api
    restart: unless-stopped
    ports:
      - "${PORT:-8005}:${PORT:-8005}"
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /tmp/videos:/tmp/videos
      # Mount Firebase JSON only if push/translation needed:
      # - ./firebaseServiceAccountForTranslation:/usr/src/app/firebaseServiceAccountForTranslation:ro
    networks:
      - e-learning-network
    environment:
      NODE_ENV: production
      BACKEND_IP: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: 6379
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8005)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: e-learning-redis
    restart: unless-stopped
    # Not published to the host — only reachable on the Docker network
    expose:
      - "6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - e-learning-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional local Mongo (skip when using Atlas)
  mongo:
    profiles: ["local-db"]
    image: mongo:7
    container_name: e-learning-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - e-learning-network

  # Dev-only mail catcher (optional)
  mailhog:
    profiles: ["mailhog"]
    image: mailhog/mailhog:latest
    container_name: e-learning-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - e-learning-network

volumes:
  mongo_data:
  redis_data:

networks:
  e-learning-network:
    driver: bridge
